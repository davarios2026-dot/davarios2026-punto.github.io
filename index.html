<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Davario's Restaurante Mar y Tierra</title>

<meta name="description" content="Davario's Restaurante Mar y Tierra. Gastronomía, ambiente y Davario's BAR VIP.">

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#090909;
color:#f5f1e8;
}

header{
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
background:rgba(0,0,0,.94);
border-bottom:1px solid #b9974b;
padding:12px 6%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:22px;
font-weight:bold;
letter-spacing:2px;
}

.logo img{
width:58px;
height:58px;
object-fit:contain;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:22px;
font-size:14px;
}

nav a:hover{
color:#d7b46a;
}

.hero{
min-height:100vh;
padding:150px 7% 80px;
display:flex;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.82)),
url("Imagen%20de%20WhatsApp%202026-07-02%20a%20las%209.01.49%20AM.jpeg")
center/cover no-repeat;
}

.hero-content{
max-width:800px;
}

.gold{
color:#d7b46a;
}

.hero h1{
font-size:clamp(44px,7vw,82px);
line-height:1;
margin:18px 0;
}

.hero p{
font-size:20px;
line-height:1.7;
color:#ddd;
}

.btn{
display:inline-block;
padding:15px 26px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
margin:8px 8px 0 0;
}

.btn-gold{
background:#d7b46a;
color:#111;
}

.btn-outline{
border:1px solid #d7b46a;
color:#fff;
}

section{
padding:90px 7%;
max-width:1200px;
margin:auto;
}

.section-title{
text-align:center;
font-size:38px;
margin-bottom:20px;
}

.subtitle{
text-align:center;
color:#bbb;
max-width:720px;
margin:0 auto 50px;
line-height:1.7;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.card{
background:#151515;
border:1px solid #292929;
padding:30px;
border-radius:16px;
}

.card h3{
color:#d7b46a;
}

.bar{
max-width:none;
background:#101010;
border-top:1px solid #292929;
border-bottom:1px solid #292929;
}

.bar-content{
max-width:1200px;
margin:auto;
}

.bar-photo{
width:100%;
max-height:650px;
object-fit:cover;
border-radius:18px;
display:block;
margin:0 auto 35px;
}

.vip{
background:linear-gradient(135deg,#19140a,#0c0c0c);
border:1px solid #b9974b;
border-radius:22px;
padding:45px;
text-align:center;
}

.vip h2{
font-size:44px;
color:#d7b46a;
}

.vip p{
color:#ddd;
line-height:1.8;
}
